<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지갑이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="{{ body_class }}">
{# today 파라미터는 모든 링크에 붙인다. 지금 화면 칸은 자식 템플릿이 active_tab으로 알려 준다 #}
{% set q = ("?today=" ~ today_q) if today_q else "" %}
<div class="app{% if no_nav %} no-nav{% endif %}">
{% block content %}{% endblock %}
</div>
{% block nav %}
<nav class="tabbar" aria-label="메뉴">
  <ul>
    <li><a href="/{{ q }}"{% if active_tab == "home" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>홈</a></li>
    <li><a href="/cart{{ q }}"{% if active_tab == "cart" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>장바구니</a></li>
    <li><a href="/appointments{{ q }}"{% if active_tab == "appointments" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>약속</a></li>
    <li><a href="/balance{{ q }}"{% if active_tab == "balance" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/></svg>밤 잔액</a></li>
  </ul>
</nav>
{% endblock %}
</body>
</html>
