services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      # 처음 실행할 때 db/ 안의 .sql 파일이 이름 순서대로 들어감 (schema → seed)
      - ./db:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: jigabi
      # 캡처로 상품 담기 (선택): .env에 키가 있을 때만 켜진다
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-terra}
    depends_on:
      - db

volumes:
  db_data:
