services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      # 처음 실행할 때 db/ 안의 .sql 파일이 이름 순서대로 들어감 (schema → seed)
      - ./db:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: jigabi
    depends_on:
      - db

volumes:
  db_data:
